[metadata]
name = scry-pythia-search
author = Seth Just
author_email = sjust@seer.bio
description = Scry plugin for Pythia
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/seerbio/scry-pythia-search
project_urls =
    Bug Tracker = https://github.com/seerbio/scry-pythia-search/issues
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Bio-Informatics

[options]
packages = find:
python_requires = >=3.8
install_requires =
    scry-ms[toml]>=0.6.2,<2.0.0
    wheely-pythia>=0.5.0,<2.0.0
    wheely-mammoth>=0.7.6,<2.0.0

[options.extras_require]
docs =
    numpydoc>=1.0.0
    sphinx-argparse>=0.2.5
    sphinx-rtd-theme>=0.5.0
    nbsphinx>=0.7.1
    ipykernel>=5.3.0
    recommonmark>=0.5.0
dev =
    pre-commit>=2.7.1
    black>=20.8b1
    pytest

[options.entry_points]
scry.search.plugins =
    pythia = scry_pythia_search.search:run_pythia_search

scry.workflow.plugins =
    pythia_mbr = scry_pythia_search.mbr:pythia_mbr_workflow
